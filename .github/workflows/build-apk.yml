name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/release.keystore \
            -alias agnesrelease \
            -storepass agnes123 \
            -keypass agnes123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Agnes, OU=Dev, O=AgnesAI, L=SG, ST=SG, C=SG"

      - name: Setup signing config
        run: |
          echo "MYAPP_RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_ALIAS=agnesrelease" >> android/gradle.properties
          echo "MYAPP_RELEASE_STORE_PASSWORD=agnes123" >> android/gradle.properties
          echo "MYAPP_RELEASE_KEY_PASSWORD=agnes123" >> android/gradle.properties

      - name: Patch signing into build.gradle
        run: bash scripts/patch-signing.sh

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agnes-AI-APK
          path: android/app/build/outputs/apk/release/*.apk
